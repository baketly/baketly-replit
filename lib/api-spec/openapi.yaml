openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace-state:
    get:
      operationId: getWorkspaceState
      tags: [workspace]
      summary: Get the saved workspace state
      responses:
        "200":
          description: Saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStateResponse"
    put:
      operationId: saveWorkspaceState
      tags: [workspace]
      summary: Save the workspace state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  $ref: "#/components/schemas/WorkspaceState"
      responses:
        "200":
          description: State saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStateResponse"
  /ingredient-label-scan:
    post:
      tags: [Ingredients]
      operationId: scanIngredientLabel
      summary: Read an ingredient nutrition label
      description: |
        Reads a product label photo with vision AI and returns nullable
        ingredient fields for review. The photo is not persisted.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Extracted fields. Null fields were not readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientLabelScanResponse"
        "400":
          description: Invalid or unsupported image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Image is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The label could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many label scan requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Vision provider failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Vision provider is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkspaceStateResponse:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/WorkspaceState"
        updatedAt:
          type: [string, "null"]
          format: date-time
      required: [state, updatedAt]
    WorkspaceState:
      type: object
      additionalProperties: true
    IngredientLabelScanResponse:
      type: object
      required:
        - productName
        - packageSize
        - packageUnit
        - servingSize
        - servingUnit
        - nutritionBasis
        - calories
        - protein_g
        - carbohydrates_g
        - fat_g
        - sugar_g
      properties:
        productName:
          type: [string, "null"]
        packageSize:
          type: [number, "null"]
        packageUnit:
          type: [string, "null"]
        servingSize:
          type: [number, "null"]
        servingUnit:
          type: [string, "null"]
        nutritionBasis:
          type: string
          enum: [per_100g, per_serving, unknown]
        calories:
          type: [number, "null"]
        protein_g:
          type: [number, "null"]
        carbohydrates_g:
          type: [number, "null"]
        fat_g:
          type: [number, "null"]
        sugar_g:
          type: [number, "null"]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

